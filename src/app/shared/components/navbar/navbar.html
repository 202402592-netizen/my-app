<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" routerLink="/home">
            <i class="bi bi-shop fs-3"></i>
            المتجر الإلكتروني
        </a>

        <button
            class="navbar-toggler"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            [class.show]="isMenuOpen"
            id="navbarNav">

            <!-- Main Navigation -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        routerLink="/home"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="bi bi-house"></i>
                        الرئيسية
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        routerLink="/products"
                        routerLinkActive="active">
                        <i class="bi bi-grid"></i>
                        المنتجات
                    </a>
                </li>

                <li class="nav-item" *ngIf="currentUser$ | async as currentUser">
                    <ng-container *ngIf="!isAdmin(currentUser)">
                        <a
                            class="nav-link"
                            routerLink="/cart"
                            routerLinkActive="active">

                            <i class="bi bi-cart"></i>
                            السلة

                            <span
                                class="badge bg-danger"
                                *ngIf="cartItemCount$ | async as cartItemCount">
                                {{ cartItemCount }}
                            </span>

                        </a>
                    </ng-container>
                </li>

                <li class="nav-item" *ngIf="currentUser$ | async as currentUser">
                    <ng-container *ngIf="isAdmin(currentUser)">
                        <a
                            class="nav-link"
                            routerLink="/admin/dashboard"
                            routerLinkActive="active">

                            <i class="bi bi-speedometer2"></i>
                            لوحة التحكم

                        </a>
                    </ng-container>
                </li>

            </ul>

            <!-- User Navigation -->
            <ul class="navbar-nav">

                <!-- Logged In User -->
                <ng-container *ngIf="currentUser$ | async as currentUser; else loginLink">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            routerLink="/home">

                            <i class="bi bi-person-circle"></i>
                            {{ currentUser.name }}

                            <span
                                class="badge bg-warning text-dark ms-1"
                                *ngIf="isAdmin(currentUser)">
                                Admin
                            </span>

                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="javascript:void(0)"
                            (click)="logout()">

                            <i class="bi bi-box-arrow-right"></i>
                            تسجيل خروج

                        </a>
                    </li>

                </ng-container>

                <!-- Guest -->
                <ng-template #loginLink>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            routerLink="/login"
                            routerLinkActive="active">

                            <i class="bi bi-box-arrow-in-right"></i>
                            تسجيل الدخول

                        </a>
                    </li>

                </ng-template>

            </ul>

        </div>
    </div>
</nav>
