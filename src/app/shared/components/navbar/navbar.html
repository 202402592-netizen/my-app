<!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow" *ngIf="currentUser$ | async as currentUser">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold"  routerLink="/home">
                <i class="bi bi-shop fs-3"></i> المتجر الإلكتروني
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" (click)="toggleMenu()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav" [class.show]="isMenuOpen">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" *ngIf="currentUser">
                        <a class="nav-link active" routerLink="/home" routerLinkActive="active" >
                            <i class="bi bi-house"></i> الرئيسية
                        </a>
                    </li>
                    <li class="nav-item"*ngIf="currentUser">
                        <a class="nav-link" routerLink="/products" routerLinkActive="active" >
                            <i class="bi bi-grid"></i> المنتجات
                        </a>
                    </li>
                    <li class="nav-item" *ngIf="currentUser && !isAdmin(currentUser)">
                        <a class="nav-link" routerLink="/cart" routerLinkActive="active" >
                            <i class="bi bi-cart"></i> السلة
                            <span class="badge bg-danger" *ngIf="(cartItemCount$ | async) as cartItemCount">{{cartItemCount}}</span>
                        </a>
                    </li>
                    <li class="nav-item" *ngIf="isAdmin(currentUser)">
                        <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active" >
                            <i class="bi bi-speedometer2"></i> لوحة التحكم
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav" >
                    <li class="nav-item" *ngIf="currentUser">
                        <a class="nav-link" routerLink="/login" >
                            <i class="bi bi-box-arrow-in-right"></i>  {{currentUser.name}}
                            <span class="badge bg-warning text-dark ms-1" *ngIf="isAdmin(currentUser)">Admin</span>
                        </a>
                    </li>
                       <li class="nav-item" *ngIf="currentUser">
                        <a class="nav-link" (click)="logout()" >
                         <i class="bi bi-box-arrow-in-right"></i> تسجيل خروج 
                        </a>
                    <li class="nav-item"*ngIf="!currentUser">
                        <a class="nav-link" routerLink="/login" >
                            <i class="bi bi-box-arrow-in-right"></i> تسجيل الدخول
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
