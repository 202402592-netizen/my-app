    <div class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg border-0 auth-card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <i class="bi bi-shop text-primary" style="font-size: 3rem;"></i>
                                <h2 class="mt-3 fw-bold">مرحباً بعودتك!</h2>
                                <p class="text-muted">سجل دخولك للمتابعة</p>
                            </div>

                            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                                <div class="mb-3">
                                    <label for="email" class="form-label">البريد الإلكتروني</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" formControlName="email"
                                        [class.is.invalid]="F['email'].invalid && F['email'].touched"
                                            placeholder="أدخل بريدك الإلكتروني">
                                    </div>
                                    <div class="invalid-feedback d-blook">
                                        <span *ngIf="F['email'].errors?.['required']">Email is required</span>
                                        <span *ngIf="F['email'].errors?.['email']">please enter a valid email</span>

                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">كلمة المرور</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password" formControlName="password"
                                        [class.is.invalid]="F['password'].invalid && F['password'].touched"
                                            placeholder="أدخل كلمة المرور">
                                    </div>
                                    <div class="invalid-feedback d-blook">
                                        <span *ngIf="F['password'].errors?.['required']">password is required</span>
                                        <span *ngIf="F['password'].errors?.['minlength']">please must be at least characters</span>

                                    </div>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">تذكرني</label>
                                </div>

                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-primary btn-lg"[disabled]="loading">
                                        <span *ngIf="!loading">
                                        <i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول
                                      </span>
                                      <span *ngIf="loading">
                                        <i class="spinner-border spinner-border-sm me- "></i>  تسجيل الدخول تم
                                      </span>
                                    </button>
                                </div>
                            </form>

                            <div class="mt-4">
                                <p class="text-center text-muted mb-2">حسابات تجريبية:</p>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-outline-warning btn-sm" (click)="fillAdminCredentials()">
                                        <i class="bi bi-shield-check"></i> دخول كـ Admin
                                        <small class="d-block">admin@store.com / admin123</small>
                                    </button>
                                    <button class="btn btn-outline-info btn-sm" (click)="fillUserCredentials()">
                                        <i class="bi bi-person"></i> دخول كـ User
                                        <small class="d-block">user@store.com / user123</small>
                                    </button>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                <a href="../index.html" class="text-muted text-decoration-none">
                                    <i class="bi bi-arrow-right"></i> العودة للرئيسية
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
