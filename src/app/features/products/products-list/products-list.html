<!-- Page Header -->
<div class="bg-light py-4">
    <div class="container">
        <h1 class="display-5 fw-bold">
            <i class="bi bi-grid text-primary"></i> المنتجات
        </h1>
        <p class="text-muted">اكتشف مجموعتنا المميزة</p>
    </div>
</div>

<!-- Products Section -->
<div class="container py-4">
    <!-- Filters -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
            <div class="input-group">
                <span class="input-group-text bg-white">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control" placeholder="ابحث عن منتج..." [(ngModel)]="searchTerm" (input)="onSearch()">
            </div>
        </div>
        <div class="col-md-6">
            <select class="form-select" [(ngModel)]="selectedCategory" (change)="onCategoryChange()">
                <option value="">جميع التصنيفات</option>
                <option *ngFor="let category of (categories$ | async)" [value]="category">{{category}}</option>
            </select>
        </div>
    </div>

    <!-- Products Grid -->
    <ng-container *ngIf="filteredProducts$ | async as filteredProducts">
        <div class="row">
            <div class="col" *ngFor="let product of filteredProducts">
                <app-product-card [product]="product" (addToCart)="addToCart($event)"></app-product-card>
            </div>
        </div>

        <div class="text-center py-5" *ngIf="filteredProducts.length === 0">
            <h3>No found</h3>
        </div>
    </ng-container>
</div>

<!-- Footer -->
<footer class="bg-dark text-white py-5 mt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-4">
                <h5 class="fw-bold mb-3">
                    <i class="bi bi-shop"></i> المتجر الإلكتروني
                </h5>
                <p class="text-white-50">
                    متجرك المفضل للتسوق عبر الإنترنت.
                </p>
            </div>
            <div class="col-md-4 mb-4">
                <h5 class="fw-bold mb-3">روابط سريعة</h5>
                <ul class="list-unstyled">
                    <li class="mb-2"><a href="../index.html" class="text-white-50 text-decoration-none">الرئيسية</a></li>
                    <li class="mb-2"><a href="products.html" class="text-white-50 text-decoration-none">المنتجات</a></li>
                    <li class="mb-2"><a href="cart.html" class="text-white-50 text-decoration-none">السلة</a></li>
                </ul>
            </div>
            <div class="col-md-4 mb-4">
                <h5 class="fw-bold mb-3">تواصل معنا</h5>
                <ul class="list-unstyled">
                    <li class="mb-2"><i class="bi bi-envelope"></i> info@store.com</li>
                    <li class="mb-2"><i class="bi bi-telephone"></i> +966 50 123 4567</li>
                </ul>
            </div>
        </div>
        <hr class="border-secondary">
        <div class="text-center text-white-50">
            <p class="mb-0">جميع الحقوق محفوظة © 2024</p>
        </div>
    </div>
</footer>
