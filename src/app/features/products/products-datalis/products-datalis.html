<ng-container *ngIf="state$ | async as state">

    <div class="container py-4" id="product-container" *ngIf="state.product as product">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a routerLink="/products" class="text-decoration-none">
                        <i class="bi bi-house"></i> Products
                    </a>
                </li>
                <li class="breadcrumb-item active"><span id="product-title">Product Title</span></li>
            </ol>
        </nav>

        <!-- Product Details -->
        <div class="row">
            <div class="col-lg-6 mb-4 mb-lg-0">
                <div class="product-image-container">
                    <img id="product-image" [src]="product.image" [alt]="product.title" class="img-fluid">
                </div>
            </div>

            <div class="col-lg-6">
                <div class="product-info">
                    <span class="badge bg-secondary mb-3" id="product-category">{{product.category}}</span>
                    <h1 class="display-5 fw-bold mb-3" id="product-title-heading">{{product.title}}</h1>

                    <div class="d-flex align-items-center mb-3" id="product-rating-block" *ngIf="product.rating">
                        <div class="text-warning me-2">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-half"></i>
                        </div>
                        <span class="text-muted"><span id="product-rating">{{product.rating.rate}}</span> (<span id="product-rating-count">{{product.rating.count}}</span> reviews)</span>
                    </div>

                    <h2 class="text-primary mb-4">$<span id="product-price">{{product.price}}</span></h2>

                    <div class="mb-4">
                        <h5 class="mb-2">Description</h5>
                        <p class="text-muted" id="product-description">{{product.description}}</p>
                    </div>

                    <div class="mb-4">
                        <h5 class="mb-2">Quantity</h5>
                        <div class="input-group quantity-selector" style="max-width: 150px;">
                            <button class="btn btn-outline-secondary" type="button" (click)="decreaseQuantity()">
                                <i class="bi bi-dash"></i>
                            </button>
                            <input type="text" id="quantity-value" class="form-control text-center" [value]="quantity" readonly>
                            <button class="btn btn-outline-secondary" type="button" (click)="increaseQuantity()">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex">
                        <button class="btn btn-primary btn-lg flex-grow-1" (click)="addToCart(product)">
                            <i class="bi bi-cart-plus"></i> Add to Cart
                        </button>
                        <button class="btn btn-outline-secondary btn-lg" (click)="goBack()">
                            <i class="bi bi-arrow-left"></i> Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-5 text-center" *ngIf="state.notFound">
        <i class="bi bi-exclamation-circle display-1 text-muted"></i>
        <h3 class="mt-3">المنتج غير موجود</h3>
        <p class="text-muted">تعذر العثور على هذا المنتج، جرّب الرجوع لصفحة المنتجات.</p>
        <button class="btn btn-primary" (click)="goBack()">
            <i class="bi bi-arrow-left"></i> الرجوع للمنتجات
        </button>
    </div>

</ng-container>
